<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GTA 7: Liberty City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',system-ui,monospace;color:#fff}
canvas{display:block;cursor:crosshair}
#ui{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
#hud-bottom{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center;background:rgba(0,0,0,0.6);padding:10px 24px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px)}
#hud-bottom > div{display:flex;flex-direction:column;gap:2px;min-width:140px}
#hud-bottom .label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#888}
#hud-bottom .value{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.hp-bar,.ar-bar{height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,0.1);margin-top:2px}
.hp-fill{height:100%;background:linear-gradient(90deg,#f44,#f88);border-radius:2px;transition:width .2s}
.ar-fill{height:100%;background:linear-gradient(90deg,#4af,#8cf);border-radius:2px;transition:width .2s}
#wanted-stars{position:absolute;top:20px;right:30px;font-size:28px;letter-spacing:6px;text-shadow:0 0 20px rgba(255,0,0,0.5),0 0 40px rgba(255,0,0,0.3);transition:all .3s}
#wanted-stars .on{color:#f44}
#wanted-stars .off{color:rgba(255,255,255,0.15)}
#weapon-display{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.4)}
#speed-display{position:absolute;bottom:130px;right:30px;text-align:right}
#speed-display .val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
#speed-display .unit{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px}
#minimap-wrap{position:absolute;bottom:140px;right:20px;border:2px solid rgba(255,255,255,0.15);border-radius:6px;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,0.5)}
#controls-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:8px;font-size:11px;color:#888;border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(4px)}
#controls-hint kbd{display:inline-block;background:rgba(255,255,255,0.08);padding:0 6px;border-radius:3px;color:#ddd;font-family:inherit;margin:0 2px}
#death-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(80,0,0,0.4),rgba(0,0,0,0.95));display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:all;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#death-screen h1{font-size:72px;color:#f44;margin-bottom:8px;text-shadow:0 0 40px rgba(255,0,0,0.6),0 0 80px rgba(255,0,0,0.3);font-weight:900;letter-spacing:4px}
#death-screen .sub{font-size:14px;color:#a66;margin-bottom:30px;letter-spacing:2px;text-transform:uppercase}
#death-screen button{padding:14px 60px;font-size:16px;background:linear-gradient(135deg,#c00,#a00);color:#fff;border:none;border-radius:8px;cursor:pointer;pointer-events:all;font-family:inherit;font-weight:600;letter-spacing:1px;transition:all .2s;box-shadow:0 4px 20px rgba(200,0,0,0.3)}
#death-screen button:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(200,0,0,0.5);background:linear-gradient(135deg,#e00,#b00)}
#death-screen .stats{margin-bottom:30px;text-align:center;font-size:13px;color:#999;line-height:1.8}
#death-screen .stats span{color:#fff;font-weight:600}
#npc-counter{position:absolute;top:20px;left:30px;font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:1px}
#npc-counter span{color:rgba(255,255,255,0.5)}
#damage-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:rgba(255,0,0,0.3);opacity:0;transition:opacity .1s}
</style>
</head>
<body>
<div id="ui">
  <div id="npc-counter">LIBERTY CITY · <span id="pop-count">0</span> civilians · <span id="cop-count">0</span> police</div>
  <div id="wanted-stars"></div>
  <div id="weapon-display">Pistol</div>
  <div id="speed-display"></div>
  <div id="hud-bottom">
    <div>
      <span class="label">Health</span>
      <span class="value" id="hp-text">100</span>
      <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
    </div>
    <div>
      <span class="label">Armor</span>
      <span class="value" id="ar-text">0</span>
      <div class="ar-bar"><div class="ar-fill" id="ar-fill"></div></div>
    </div>
  </div>
  <div id="minimap-wrap"><canvas id="minimap" width="180" height="180"></canvas></div>
  <div id="controls-hint"><kbd>W A S D</kbd> move · <kbd>&#x1F5B1;</kbd> aim · <kbd>LMB</kbd> shoot · <kbd>E</kbd> enter/exit car · <kbd>F</kbd> honk</div>
</div>
<div id="damage-overlay"></div>
<canvas id="game"></canvas>
<div id="death-screen">
  <h1>WASTED</h1>
  <div class="sub">Liberty City · 2026</div>
  <div class="stats">Money earned: $<span id="final-money">0</span></div>
  <button onclick="restartGame()">RESTART</button>
</div>
<script>
// ==================== SETUP ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight});

// ==================== CONSTANTS ====================
const TILE = 40;
const MAP_W = 80;
const MAP_H = 80;
const ROAD_SPACING = 6;
const ROAD_WIDTH = 2;
const TPS = 60;
const dt = 1/TPS;

// ==================== STATE ====================
let gameRunning = true;
let money = 0;
let frame = 0;
let screenShake = 0;
let damageFlash = 0;
let totalEarned = 0;

// ==================== MAP ====================
let map = [];
let buildingStyles = [];
let decorations = [];

function generateMap() {
  map = [];
  buildingStyles = [];
  decorations = [];
  for(let y=0; y<MAP_H; y++) {
    map[y] = [];
    buildingStyles[y] = [];
    for(let x=0; x<MAP_W; x++) {
      const nearRoad = (
        x % ROAD_SPACING < ROAD_WIDTH ||
        y % ROAD_SPACING < ROAD_WIDTH
      );
      if(nearRoad) {
        const dx = Math.min(x % ROAD_SPACING, ROAD_SPACING - (x % ROAD_SPACING) - 1);
        const dy = Math.min(y % ROAD_SPACING, ROAD_SPACING - (y % ROAD_SPACING) - 1);
        const dist = Math.min(dx, dy);
        if(dist === ROAD_WIDTH-1) map[y][x] = 2;
        else map[y][x] = 1;
      } else {
        const blockX = Math.floor(x / ROAD_SPACING);
        const blockY = Math.floor(y / ROAD_SPACING);
        const hash = ((blockX * 73856093 + blockY * 19349663) % 1000) / 1000;
        if(hash < 0.10) map[y][x] = 3;
        else if(hash < 0.16) map[y][x] = 4;
        else if(hash < 0.20) map[y][x] = 5;
        else map[y][x] = 0;
        buildingStyles[y][x] = Math.floor(hash * 6);
      }
    }
  }
  const cx = Math.floor(MAP_W/2); const cy = Math.floor(MAP_H/2);
  for(let dy=-4; dy<=4; dy++) for(let dx=-4; dx<=4; dx++) {
    const mx=cx+dx, my=cy+dy;
    if(mx>=0&&mx<MAP_W&&my>=0&&my<MAP_H) {
      map[my][mx]=1;
      buildingStyles[my][mx]=0;
    }
  }
}

function isRoad(x,y) {
  const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
  return tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H&&(map[ty][tx]===1||map[ty][tx]===2);
}
function isSolid(x,y) {
  const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return true;
  return map[ty][tx]===0;
}
function getTile(x,y) {
  const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return 1;
  return map[ty][tx];
}

// ==================== ENTITIES ====================
let player, cars=[], npcs=[], police=[], bullets=[], particles=[], rain=[];

class Player {
  constructor() {
    this.x = MAP_W/2*TILE;
    this.y = MAP_H/2*TILE;
    this.vx=0;this.vy=0;
    this.angle=0;
    this.health=100;
    this.maxHealth=100;
    this.armor=0;
    this.speed=200;
    this.radius=12;
    this.wanted=0;
    this.wantedTimer=0;
    this.inCar=null;
    this.weapon='pistol';
    this.shootCooldown=0;
    this.alive=true;
    this.bobPhase=0;
  }
}

class Car {
  constructor(x,y) {
    this.x=x;this.y=y;
    this.vx=0;this.vy=0;
    this.angle=Math.random()*Math.PI*2;
    this.speed=0;
    this.maxSpeed=350;
    this.accel=200;
    this.brake=150;
    this.friction=0.98;
    this.turnSpeed=2.5;
    this.width=22;
    this.height=40;
    this.color=carColors[Math.floor(Math.random()*carColors.length)];
    this.type=Math.floor(Math.random()*4);
    this.health=100;
    this.driver=null;
    this.honkTimer=0;
  }
}

class NPC {
  constructor() {
    let x,y;
    do {
      x=Math.random()*(MAP_W-2)*TILE+TILE;
      y=Math.random()*(MAP_H-2)*TILE+TILE;
    } while(isSolid(x,y));
    this.x=x;this.y=y;
    this.vx=0;this.vy=0;
    this.angle=Math.random()*Math.PI*2;
    this.speed=80+Math.random()*40;
    this.radius=10;
    this.health=30;
    this.color=npcColors[Math.floor(Math.random()*npcColors.length)];
    this.state='walk';
    this.walkTarget={x:this.x,y:this.y};
    this.stateTimer=0;
    this.fleeTimer=0;
    this.alive=true;
    this.gender=Math.random()>0.5?'male':'female';
    this.bobPhase=Math.random()*Math.PI*2;
  }
}

class Police {
  constructor() {
    let x,y;
    do {
      x=Math.random()*(MAP_W-2)*TILE+TILE;
      y=Math.random()*(MAP_H-2)*TILE+TILE;
    } while(isSolid(x,y));
    this.x=x;this.y=y;
    this.vx=0;this.vy=0;
    this.angle=Math.random()*Math.PI*2;
    this.speed=250;
    this.radius=12;
    this.health=60;
    this.shootCooldown=0;
    this.shootAccuracy=0.4;
    this.state='patrol';
    this.alive=true;
    this.aware=false;
    this.sirenPhase=0;
  }
}

class Bullet {
  constructor(x,y,angle,owner) {
    this.x=x;this.y=y;
    this.angle=angle;
    this.speed=900;
    this.vx=Math.cos(angle)*this.speed;
    this.vy=Math.sin(angle)*this.speed;
    this.owner=owner;
    this.life=1.5;
    this.radius=owner===player?3:2.5;
    this.damage=owner===player?12:8;
    this.trail=[];
  }
}

class Particle {
  constructor(x,y,color,type) {
    this.x=x;this.y=y;
    const a=Math.random()*Math.PI*2;
    const spd=30+Math.random()*120;
    this.vx=Math.cos(a)*spd;
    this.vy=Math.sin(a)*spd;
    this.life=0.2+Math.random()*0.5;
    this.maxLife=this.life;
    this.size=1.5+Math.random()*4;
    this.color=color;
    this.type=type||'spark';
    this.gravity=type==='smoke'?-10:type==='blood'?40:0;
  }
}

class RainDrop {
  constructor() {
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.speed=400+Math.random()*300;
    this.length=10+Math.random()*15;
    this.opacity=0.1+Math.random()*0.2;
  }
}

const carColors = ['#cc2222','#2244cc','#22aa44','#ccaa22','#cc22aa','#22cccc','#e8e8e8','#666666','#2a2a2a','#dd7722','#2266cc','#882244','#44aa88','#cc6622'];
const npcColors = ['#4488cc','#cc4488','#cc8844','#44cc88','#88cc44','#8844cc','#cc4444','#4488aa','#aa4488','#66aa44','#cc6644','#44aa66'];

// ==================== SPAWNING ====================
function spawnCars() {
  for(let i=0;i<40;i++) {
    let x,y; let att=0;
    do {
      x=Math.floor(Math.random()*MAP_W)*TILE+TILE/2;
      y=Math.floor(Math.random()*MAP_H)*TILE+TILE/2;
      att++;
    } while((!isRoad(x,y)||isSolid(x,y))&&att<100);
    if(att<100) cars.push(new Car(x,y));
  }
}

function spawnNPCs() {
  for(let i=0;i<65;i++) npcs.push(new NPC());
}

function initRain() {
  rain=[];
  for(let i=0;i<120;i++) rain.push(new RainDrop());
}

// ==================== INPUT ====================
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='e') handleEnterExit();
  if(e.key.toLowerCase()==='f') handleHonk();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

let mouseX=0,mouseY=0,mouseDown=false;
canvas.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
canvas.addEventListener('mousedown',e=>{if(e.button===0)mouseDown=true});
canvas.addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// ==================== GAME LOGIC ====================
function handleEnterExit() {
  if(!player.alive) return;
  if(player.inCar) {
    const car=player.inCar;
    const ex=car.x+Math.cos(car.angle+Math.PI/2)*35;
    const ey=car.y+Math.sin(car.angle+Math.PI/2)*35;
    if(!isSolid(ex,ey)) {
      player.x=ex;player.y=ey;
      player.inCar=null;
      car.driver=null;
      player.angle=car.angle;
    }
  } else {
    for(const car of cars) {
      const dx=player.x-car.x, dy=player.y-car.y;
      if(Math.sqrt(dx*dx+dy*dy)<35 && !car.driver) {
        player.inCar=car;
        car.driver=player;
        player.x=car.x;
        player.y=car.y;
        break;
      }
    }
  }
}

function handleHonk() {
  if(player.inCar) player.inCar.honkTimer=0.5;
}

function shoot(angle,owner) {
  if(owner===player) {
    if(player.shootCooldown>0) return;
    player.shootCooldown=0.12;
  } else {
    if(owner.shootCooldown>0) return;
    owner.shootCooldown=0.3;
  }
  const spread=owner===player?0.03:0.12;
  const a=angle+(Math.random()-0.5)*spread;
  const startX=owner.x+Math.cos(a)*20;
  const startY=owner.y+Math.sin(a)*20;
  bullets.push(new Bullet(startX,startY,a,owner));

  for(let i=0;i<4;i++) {
    const p=new Particle(startX,startY,['#ff8','#ff4','#fa0'][i%3],'spark');
    p.vx=Math.cos(a+(Math.random()-0.5)*0.8)*(100+Math.random()*200);
    p.vy=Math.sin(a+(Math.random()-0.5)*0.8)*(100+Math.random()*200);
    p.life=0.05+Math.random()*0.1;
    particles.push(p);
  }
  for(let i=0;i<2;i++) {
    const p=new Particle(startX+Math.cos(a)*5,startY+Math.sin(a)*5,'rgba(180,180,180,0.4)','smoke');
    p.size=3+Math.random()*4;
    p.vx=(Math.random()-0.5)*15;
    p.vy=(Math.random()-0.5)*15-5;
    p.life=0.15+Math.random()*0.2;
    particles.push(p);
  }

  if(owner===player) {
    player.wanted = Math.min(5, player.wanted + 0.5);
    player.wantedTimer=30;
    screenShake=3;
    for(const cop of police) {
      if(dist(player,cop)<250) cop.aware=true;
    }
  }
}

function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function lerp(a,b,t){return a+(b-a)*t}

function updatePlayer() {
  if(!player.alive) return;
  if(player.wantedTimer>0) player.wantedTimer-=dt;
  else if(player.wanted>0) player.wanted = Math.max(0, player.wanted - 0.02);
  if(player.inCar) updatePlayerInCar();
  else updatePlayerOnFoot();
  if(mouseDown && player.alive) {
    const aimAngle = player.inCar ? player.inCar.angle : player.angle;
    shoot(aimAngle, player);
  }
  if(player.shootCooldown>0) player.shootCooldown-=dt;
  player.bobPhase+=dt*8;
}

function updatePlayerOnFoot() {
  const dx=mouseX-canvas.width/2;
  const dy=mouseY-canvas.height/2;
  player.angle=Math.atan2(dy,dx);
  let mx=0,my=0;
  if(keys['w']||keys['arrowup']) my=-1;
  if(keys['s']||keys['arrowdown']) my=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;
  if(mx!==0||my!==0) {
    const len=Math.sqrt(mx*mx+my*my); mx/=len;my/=len;
    player.vx=mx*player.speed; player.vy=my*player.speed;
  } else { player.vx*=0.85; player.vy*=0.85; }
  const nx=player.x+player.vx*dt;
  const ny=player.y+player.vy*dt;
  if(!isSolid(nx,player.y)) player.x=nx; else player.vx=0;
  if(!isSolid(player.x,ny)) player.y=ny; else player.vy=0;
  player.x=clamp(player.x,TILE,MAP_W*TILE-TILE);
  player.y=clamp(player.y,TILE,MAP_H*TILE-TILE);
}

function updatePlayerInCar() {
  const car=player.inCar;
  let accel=0,turn=0;
  if(keys['w']||keys['arrowup']) accel=1;
  if(keys['s']||keys['arrowdown']) accel=-1;
  if(keys['a']||keys['arrowleft']) turn=-1;
  if(keys['d']||keys['arrowright']) turn=1;
  if(turn!==0 && Math.abs(car.speed)>10) {
    car.angle+=turn*car.turnSpeed*dt*(car.speed/car.maxSpeed);
  }
  if(accel>0) {
    car.speed=Math.min(car.speed+car.accel*dt,car.maxSpeed);
  } else if(accel<0) {
    car.speed=Math.max(car.speed-car.brake*dt,-car.maxSpeed*0.4);
  } else {
    car.speed*=car.friction;
    if(Math.abs(car.speed)<1) car.speed=0;
  }
  car.vx=Math.cos(car.angle)*car.speed;
  car.vy=Math.sin(car.angle)*car.speed;
  const nx=car.x+car.vx*dt;
  const ny=car.y+car.vy*dt;
  if(!isSolid(nx,car.y)) car.x=nx;
  else {car.speed*=-0.3;car.vx=0;screenShake=5;}
  if(!isSolid(car.x,ny)) car.y=ny;
  else {car.speed*=-0.3;car.vy=0;screenShake=5;}
  car.x=clamp(car.x,TILE*2,MAP_W*TILE-TILE*2);
  car.y=clamp(car.y,TILE*2,MAP_H*TILE-TILE*2);
  player.x=car.x;player.y=car.y;
  if(car.honkTimer>0) car.honkTimer-=dt;
  if(Math.abs(car.speed)<5) {
    for(let a=0;a<3;a++) {
      if(isSolid(car.x,car.y)||!isRoad(car.x,car.y)) {
        car.x-=Math.cos(car.angle)*4;
        car.y-=Math.sin(car.angle)*4;
        car.speed*=0.5;
      } else break;
    }
  }
}

function updateNPCs() {
  for(const npc of npcs) {
    if(!npc.alive) continue;
    npc.stateTimer-=dt;
    npc.fleeTimer=Math.max(0,npc.fleeTimer-dt);
    npc.bobPhase+=dt*6;
    if(npc.fleeTimer<=0) {
      for(const b of bullets) {
        if(b.owner===player && dist(npc,b)<200) {
          npc.state='flee'; npc.fleeTimer=3; npc.stateTimer=3;
          const a=Math.atan2(npc.y-player.y,npc.x-player.x);
          npc.walkTarget.x=npc.x+Math.cos(a)*300;
          npc.walkTarget.y=npc.y+Math.sin(a)*300;
          break;
        }
      }
    }
    if(npc.stateTimer<=0) {
      if(npc.state==='walk') {
        const a=Math.random()*Math.PI*2;
        const d=50+Math.random()*100;
        npc.walkTarget.x=npc.x+Math.cos(a)*d;
        npc.walkTarget.y=npc.y+Math.sin(a)*d;
        npc.stateTimer=2+Math.random()*3;
      } else if(npc.state==='flee') {
        npc.state='walk'; npc.stateTimer=2+Math.random()*3;
      }
    }
    const dx=npc.walkTarget.x-npc.x;
    const dy=npc.walkTarget.y-npc.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>5) {
      npc.angle=Math.atan2(dy,dx);
      const spd=npc.state==='flee'?npc.speed*1.5:npc.speed;
      const vx=Math.cos(npc.angle)*spd*dt;
      const vy=Math.sin(npc.angle)*spd*dt;
      if(!isSolid(npc.x+vx,npc.y)) npc.x+=vx;
      if(!isSolid(npc.x,npc.y+vy)) npc.y+=vy;
    }
    npc.x=clamp(npc.x,TILE,MAP_W*TILE-TILE);
    npc.y=clamp(npc.y,TILE,MAP_H*TILE-TILE);
  }
}

function spawnPolice() {
  const wantedLevel = Math.floor(player.wanted);
  const targetCount = wantedLevel * 3 + 1;
  const currentCount = police.filter(p=>p.alive).length;
  if(currentCount < targetCount && Math.random()<0.3) {
    const angle=Math.random()*Math.PI*2;
    const dist=300+Math.random()*250;
    let px=player.x+Math.cos(angle)*dist;
    let py=player.y+Math.sin(angle)*dist;
    const tx=Math.floor(px/TILE); const ty=Math.floor(py/TILE);
    if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H&&(map[ty][tx]===1||map[ty][tx]===2)) {
      const cop=new Police();
      cop.x=px;cop.y=py;cop.aware=true;
      police.push(cop);
    }
  }
  police=police.filter(p=>p.alive);
}

function updatePolice() {
  spawnPolice();
  for(const cop of police) {
    if(!cop.alive) continue;
    cop.shootCooldown=Math.max(0,cop.shootCooldown-dt);
    cop.sirenPhase+=dt*8;
    const d=dist(cop,player);
    if(cop.aware) {
      const dx=player.x-cop.x;
      const dy=player.y-cop.y;
      cop.angle=Math.atan2(dy,dx);
      if(d>150) {
        const spd=cop.speed*(0.8+player.wanted*0.1);
        const vx=Math.cos(cop.angle)*spd*dt;
        const vy=Math.sin(cop.angle)*spd*dt;
        if(!isSolid(cop.x+vx,cop.y)) cop.x+=vx;
        if(!isSolid(cop.x,cop.y+vy)) cop.y+=vy;
      }
      if(d<400 && player.alive) {
        const hit=!isSolid((cop.x+player.x)/2,(cop.y+player.y)/2);
        if(hit || d<200) {
          cop.angle=Math.atan2(player.y-cop.y,player.x-cop.x);
          shoot(cop.angle,cop);
        }
      }
    } else {
      if(d<250) cop.aware=true;
      if(Math.random()<0.01) cop.angle+=(Math.random()-0.5)*2;
      const vx=Math.cos(cop.angle)*80*dt;
      const vy=Math.sin(cop.angle)*80*dt;
      if(!isSolid(cop.x+vx,cop.y)) cop.x+=vx; else cop.angle+=Math.PI/2;
      if(!isSolid(cop.x,cop.y+vy)) cop.y+=vy; else cop.angle-=Math.PI/2;
    }
    cop.x=clamp(cop.x,TILE,MAP_W*TILE-TILE);
    cop.y=clamp(cop.y,TILE,MAP_H*TILE-TILE);
  }
}

function updateBullets() {
  for(let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>6) b.trail.shift();
    if(b.life<=0||b.x<0||b.x>MAP_W*TILE||b.y<0||b.y>MAP_H*TILE) {bullets.splice(i,1);continue;}
    if(isSolid(b.x,b.y)) {
      for(let j=0;j<4;j++) particles.push(new Particle(b.x,b.y,'#aaa','spark'));
      bullets.splice(i,1); continue;
    }
    if(b.owner!==player) {
      if(player.alive && dist(b,player)<player.radius+(player.inCar?18:0)) {
        const dmg=b.damage;
        if(player.armor>0) {const ab=Math.min(player.armor,dmg*0.6);player.armor-=ab;player.health-=dmg-ab;}
        else player.health-=dmg;
        for(let j=0;j<10;j++) particles.push(new Particle(b.x,b.y,'#f44','blood'));
        damageFlash=0.3;
        screenShake=4;
        bullets.splice(i,1);
        if(player.health<=0){player.health=0;player.alive=false;gameOver();}
        continue;
      }
    } else {
      for(const cop of police) {
        if(!cop.alive||dist(b,cop)>=cop.radius) continue;
        cop.health-=b.damage; cop.aware=true;
        for(let j=0;j<8;j++) particles.push(new Particle(b.x,b.y,'#f44','blood'));
        bullets.splice(i,1);
        if(cop.health<=0) {cop.alive=false;money+=50;totalEarned+=50;player.wanted=Math.max(0,player.wanted-0.5);}
        break;
      }
      if(i>=bullets.length) continue;
      for(const npc of npcs) {
        if(!npc.alive||dist(b,npc)>=npc.radius) continue;
        npc.health-=b.damage; npc.state='flee';npc.fleeTimer=5;
        for(let j=0;j<6;j++) particles.push(new Particle(b.x,b.y,'#f44','blood'));
        bullets.splice(i,1);
        if(npc.health<=0){npc.alive=false;money+=10;totalEarned+=10;}
        break;
      }
    }
  }
}

function updateParticles() {
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=p.gravity*dt;
    p.life-=dt; p.vx*=0.96; p.vy*=0.96;
    if(p.life<=0) particles.splice(i,1);
  }
  if(particles.length>300) particles.splice(0,particles.length-300);
}

function updateRain() {
  for(const r of rain) {
    r.y+=r.speed*dt;
    r.x-=30*dt;
    if(r.y>canvas.height+20) {r.y=-20;r.x=Math.random()*canvas.width;}
    if(r.x<-20) {r.x=canvas.width+20;r.y=Math.random()*canvas.height;}
  }
}

function gameOver() {
  document.getElementById('death-screen').style.display='flex';
  document.getElementById('final-money').textContent=totalEarned;
  gameRunning=false;
}

function restartGame() {
  document.getElementById('death-screen').style.display='none';
  init();
}

// ==================== RENDERING ====================
let camera={x:0,y:0};
let smoothCam={x:0,y:0};
let time=0;

function render() {
  time+=dt;

  const targetX=player.x-canvas.width/2;
  const targetY=player.y-canvas.height/2;
  smoothCam.x+=(targetX-smoothCam.x)*0.08;
  smoothCam.y+=(targetY-smoothCam.y)*0.08;
  camera.x=smoothCam.x+(Math.random()-0.5)*screenShake;
  camera.y=smoothCam.y+(Math.random()-0.5)*screenShake;
  screenShake*=0.9;
  if(screenShake<0.01) screenShake=0;

  if(damageFlash>0) {
    document.getElementById('damage-overlay').style.opacity=damageFlash;
    damageFlash-=dt*2;
  } else document.getElementById('damage-overlay').style.opacity=0;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  const startTX=Math.max(0,Math.floor(camera.x/TILE)-2);
  const startTY=Math.max(0,Math.floor(camera.y/TILE)-2);
  const endTX=Math.min(MAP_W,Math.ceil((camera.x+canvas.width)/TILE)+2);
  const endTY=Math.min(MAP_H,Math.ceil((camera.y+canvas.height)/TILE)+2);

  // === TILES ===
  for(let y=startTY;y<endTY;y++) {
    for(let x=startTX;x<endTX;x++) {
      const tile=map[y][x];
      const px=x*TILE, py=y*TILE;
      const hash=((x+1)*73856093+(y+1)*19349663)%1000/1000;
      const bs=buildingStyles[y]?.[x]||0;

      if(tile===0) {
        // === BUILDINGS ===
        const style=bs%6;
        let r,g,b, roofColor, windowColor;

        switch(style) {
          case 0: // Brick residential
            r=140+Math.floor(hash*40); g=90+Math.floor(hash*30); b=80+Math.floor(hash*20);
            roofColor='#4a3525'; windowColor='rgba(200,220,255,0.5)';
            break;
          case 1: // Modern office (glass)
            r=60+Math.floor(hash*30); g=90+Math.floor(hash*20); b=130+Math.floor(hash*30);
            roofColor='#3a4a5a'; windowColor='rgba(150,200,255,0.4)';
            break;
          case 2: // Warm beige/commercial
            r=170+Math.floor(hash*30); g=150+Math.floor(hash*20); b=120+Math.floor(hash*20);
            roofColor='#5a4a3a'; windowColor='rgba(255,220,180,0.35)';
            break;
          case 3: // Dark industrial
            r=80+Math.floor(hash*20); g=75+Math.floor(hash*20); b=70+Math.floor(hash*20);
            roofColor='#3a3535'; windowColor='rgba(180,200,220,0.15)';
            break;
          case 4: // White modern
            r=200+Math.floor(hash*30); g=195+Math.floor(hash*30); b=190+Math.floor(hash*30);
            roofColor='#5a5a5a'; windowColor='rgba(200,230,255,0.35)';
            break;
          default: // Colorful shop
            r=130+Math.floor(hash*100); g=100+Math.floor(hash*80); b=140+Math.floor(hash*60);
            roofColor='#4a3a4a'; windowColor='rgba(255,255,200,0.4)';
            break;
        }

        // Main wall
        ctx.fillStyle=`rgb(${r},${g},${b})`;
        ctx.fillRect(px,py,TILE,TILE);

        // Building texture - brick/panel lines
        if(style===0||style===3) {
          ctx.strokeStyle='rgba(0,0,0,0.06)';
          ctx.lineWidth=0.5;
          for(let yy=py+4;yy<py+TILE;yy+=8) { ctx.beginPath(); ctx.moveTo(px,yy); ctx.lineTo(px+TILE,yy); ctx.stroke(); }
          for(let xx=px+4;xx<px+TILE;xx+=8) { ctx.beginPath(); ctx.moveTo(xx,py); ctx.lineTo(xx,py+TILE); ctx.stroke(); }
        }

        // Roof parapet
        ctx.fillStyle=roofColor;
        ctx.fillRect(px,py-1,TILE,4);

        // Awning for shops (style 5)
        if(style===5) {
          ctx.fillStyle='rgba(180,50,50,0.6)';
          ctx.fillRect(px+2,py+5,TILE-4,5);
          ctx.fillStyle='rgba(200,200,200,0.08)';
          for(let sa=0;sa<4;sa++) {
            ctx.fillRect(px+4+sa*8,py+5,6,5);
          }
        }

        // Windows with style-specific patterns
        const ws=6, gap=6;
        for(let wy=py+gap+3;wy<py+TILE-gap;wy+=ws+gap) {
          for(let wx=px+gap;wx<px+TILE-gap;wx+=ws+gap) {
            const wIdx=Math.floor(wx/2)+Math.floor(wy/3);
            const lit=(wIdx%5===0||wIdx%7===0)?0.7:(wIdx%3===0?0.2:0.05);
            ctx.fillStyle=windowColor.replace('0.4',lit.toString()).replace('0.35',lit.toString()).replace('0.5',lit.toString()).replace('0.15',lit.toString());
            // But actually let's just compute it properly
            const alpha=lit>0.5?0.6:lit>0.2?0.15:0.03;
            ctx.fillStyle=`rgba(255,255,220,${alpha})`;
            ctx.fillRect(wx,wy,ws,ws);
            // Window frame cross
            ctx.strokeStyle='rgba(0,0,0,0.15)';
            ctx.lineWidth=0.5;
            ctx.beginPath();
            ctx.moveTo(wx+ws/2,wy); ctx.lineTo(wx+ws/2,wy+ws);
            ctx.moveTo(wx,wy+ws/2); ctx.lineTo(wx+ws,wy+ws/2);
            ctx.stroke();
          }
        }

        // Edge highlights
        ctx.fillStyle='rgba(255,255,255,0.04)';
        ctx.fillRect(px,py,TILE,1);
        ctx.fillRect(px,py,1,TILE);

        // Ground level detail - door or garage
        if(hash<0.25) {
          ctx.fillStyle='#3a3020';
          ctx.fillRect(px+8,py+TILE-12,8,12);
          ctx.fillStyle='#555';
          ctx.fillRect(px+14,py+TILE-6,2,3);
        } else if(hash<0.4) {
          ctx.fillStyle='rgba(100,100,100,0.3)';
          ctx.fillRect(px+4,py+TILE-10,TILE-8,10);
          // garage door lines
          ctx.strokeStyle='rgba(0,0,0,0.1)';
          ctx.lineWidth=0.5;
          for(let yy=py+TILE-9;yy<py+TILE;yy+=3) { ctx.beginPath(); ctx.moveTo(px+5,yy); ctx.lineTo(px+TILE-5,yy); ctx.stroke(); }
        }

      } else if(tile===1) {
        // === ROADS ===
        const isX = x%ROAD_SPACING<ROAD_WIDTH && y%ROAD_SPACING<ROAD_WIDTH;
        const roadVar=hash*0.05-0.025;
        const base=isX?62+roadVar*255:52+roadVar*255;
        const c=Math.floor(clamp(base,38,78));
        ctx.fillStyle=`rgb(${c},${c},${c+3})`;
        ctx.fillRect(px,py,TILE,TILE);

        // Asphalt texture
        ctx.fillStyle=`rgba(0,0,0,${hash*0.025})`;
        ctx.fillRect(px+Math.floor(hash*12),py+Math.floor((hash*17)%7),2,2);
        ctx.fillRect(px+Math.floor((1-hash)*10),py+Math.floor((hash*23)%8),3,1);
        // Crack
        if(hash<0.08) {
          ctx.strokeStyle='rgba(0,0,0,0.08)';
          ctx.lineWidth=0.5;
          ctx.beginPath();
          ctx.moveTo(px+Math.floor(hash*20),py);
          ctx.lineTo(px+Math.floor(hash*30),py+TILE);
          ctx.stroke();
        }

        // Lane markings
        const isVertRoad = x%ROAD_SPACING===0;
        const isHorizRoad = y%ROAD_SPACING===0;
        if(!isX) {
          if(isVertRoad) {
            // Vertical road - horizontal dashes at edges
            ctx.fillStyle='rgba(255,255,255,0.12)';
            for(let yy=py+2;yy<py+TILE-6;yy+=12) {
              ctx.fillRect(px+2,yy,5,6);
              ctx.fillRect(px+TILE-7,yy,5,6);
            }
            // Center line
            ctx.fillStyle='rgba(255,255,200,0.2)';
            for(let yy=py+2;yy<py+TILE-2;yy+=18) {
              ctx.fillRect(px+Math.floor(TILE/2)-1,yy,2,10);
            }
          }
          if(isHorizRoad) {
            ctx.fillStyle='rgba(255,255,255,0.12)';
            for(let xx=px+2;xx<px+TILE-6;xx+=12) {
              ctx.fillRect(xx,py+2,6,5);
              ctx.fillRect(xx,py+TILE-7,6,5);
            }
            ctx.fillStyle='rgba(255,255,200,0.2)';
            for(let xx=px+2;xx<px+TILE-2;xx+=18) {
              ctx.fillRect(xx,py+Math.floor(TILE/2)-1,10,2);
            }
          }
        }

        // Crosswalk at intersections
        if(isX) {
          ctx.fillStyle='rgba(255,255,255,0.07)';
          for(let i=0;i<5;i++) {
            ctx.fillRect(px+3+i*7,py+3,3,TILE-6);
          }
        }

      } else if(tile===2) {
        // === SIDEWALK ===
        const sv=0.55+hash*0.1;
        const sc=Math.floor(clamp(180*sv,130,200));
        ctx.fillStyle=`rgb(${sc},${sc-4},${sc-12})`;
        ctx.fillRect(px,py,TILE,TILE);
        // Tile pattern
        ctx.strokeStyle='rgba(0,0,0,0.04)';
        ctx.lineWidth=0.5;
        ctx.strokeRect(px+1,py+1,TILE-2,TILE-2);
        // Manhole
        if(hash<0.06) {
          ctx.fillStyle='rgba(50,50,50,0.2)';
          ctx.beginPath();
          ctx.arc(px+TILE/2,py+TILE/2,4,0,Math.PI*2);
          ctx.fill();
          ctx.strokeStyle='rgba(50,50,50,0.15)';
          ctx.lineWidth=0.5;
          ctx.beginPath();
          ctx.moveTo(px+TILE/2-3,py+TILE/2); ctx.lineTo(px+TILE/2+3,py+TILE/2);
          ctx.moveTo(px+TILE/2,py+TILE/2-3); ctx.lineTo(px+TILE/2,py+TILE/2+3);
          ctx.stroke();
        }
        // Fire hydrant
        if(hash>=0.06&&hash<0.09) {
          ctx.fillStyle='#aa3333';
          ctx.fillRect(px+TILE/2-2,py+TILE/2-3,4,7);
          ctx.fillStyle='#882222';
          ctx.fillRect(px+TILE/2-3,py+TILE/2-4,6,2);
          ctx.fillRect(px+TILE/2-1,py+TILE/2-1,2,2);
        }

      } else if(tile===3) {
        // === PARK / GREEN SPACE ===
        const shades=['#2a4a2a','#2a5030','#224a28','#305535','#2d5530','#285030'];
        ctx.fillStyle=shades[Math.floor(hash*shades.length)];
        ctx.fillRect(px,py,TILE,TILE);
        // Grass detail
        ctx.fillStyle='rgba(50,80,50,0.05)';
        ctx.fillRect(px+Math.floor(hash*15),py+Math.floor((1-hash)*12),4,4);
        ctx.fillRect(px+Math.floor((1-hash)*18),py+Math.floor(hash*16),3,3);
        // Tree
        if(hash<0.2) {
          ctx.fillStyle='#3a2818';
          ctx.fillRect(px+TILE/2-2,py+TILE/2+4,4,7);
          // Canopy
          ctx.fillStyle='#1a4a2a';
          ctx.beginPath();
          ctx.arc(px+TILE/2,py+TILE/2-3,9,0,Math.PI*2);
          ctx.fill();
          ctx.fillStyle='#2a6a3a';
          ctx.beginPath();
          ctx.arc(px+TILE/2-3,py+TILE/2-6,6,0,Math.PI*2);
          ctx.fill();
          ctx.fillStyle='#3a7a4a';
          ctx.beginPath();
          ctx.arc(px+TILE/2+3,py+TILE/2-5,5,0,Math.PI*2);
          ctx.fill();
        } else if(hash<0.30) {
          // Bush
          ctx.fillStyle='#2a5a2a';
          ctx.beginPath();
          ctx.arc(px+TILE/2,py+TILE/2,6,0,Math.PI*2);
          ctx.fill();
          ctx.fillStyle='#3a6a3a';
          ctx.beginPath();
          ctx.arc(px+TILE/2-2,py+TILE/2-2,4,0,Math.PI*2);
          ctx.fill();
        } else if(hash<0.35) {
          // Bench
          ctx.fillStyle='#4a3a2a';
          ctx.fillRect(px+6,py+TILE/2-2,12,3);
          ctx.fillRect(px+6,py+TILE/2+1,12,2);
          ctx.fillStyle='#3a2a1a';
          ctx.fillRect(px+7,py+TILE/2-5,2,3);
          ctx.fillRect(px+15,py+TILE/2-5,2,3);
        } else if(hash<0.38) {
          // Flowers
          ctx.fillStyle='#8a3a3a';
          ctx.beginPath();
          ctx.arc(px+TILE/2-3,py+TILE/2-2,3,0,Math.PI*2);
          ctx.fill();
          ctx.fillStyle='#aa4a4a';
          ctx.beginPath();
          ctx.arc(px+TILE/2+3,py+TILE/2-1,3,0,Math.PI*2);
          ctx.fill();
          ctx.fillStyle='#7a5a2a';
          ctx.beginPath();
          ctx.arc(px+TILE/2,py+TILE/2+2,2,0,Math.PI*2);
          ctx.fill();
        }

      } else if(tile===4) {
        // === PARKING LOT ===
        ctx.fillStyle='#4a4a4a';
        ctx.fillRect(px,py,TILE,TILE);
        // Parking lines
        ctx.fillStyle='rgba(255,255,255,0.06)';
        ctx.fillRect(px+2,py+2,2,TILE-4);
        ctx.fillRect(px+TILE-4,py+2,2,TILE-4);
        // Space marking
        ctx.fillStyle='rgba(255,255,255,0.04)';
        ctx.fillRect(px+6,py+2,8,2);

      } else if(tile===5) {
        // === CONSTRUCTION SITE ===
        ctx.fillStyle='#6a5a4a';
        ctx.fillRect(px,py,TILE,TILE);
        // Gravel texture
        ctx.fillStyle='rgba(80,70,55,0.08)';
        for(let i=0;i<8;i++) {
          ctx.beginPath();
          ctx.arc(px+Math.floor(hash*17+i*5)%TILE,py+Math.floor((1-hash)*23+i*7)%TILE,1.5,0,Math.PI*2);
          ctx.fill();
        }
        // Fence
        ctx.fillStyle='rgba(200,180,100,0.15)';
        ctx.fillRect(px,py,2,TILE);
        ctx.fillRect(px+TILE-2,py,2,TILE);
        ctx.fillRect(px,py,TILE,2);
        ctx.fillRect(px,py+TILE-2,TILE,2);
        // Warning sign
        if(hash<0.3) {
          ctx.fillStyle='#cc8800';
          ctx.fillRect(px+TILE/2-3,py+4,6,8);
          ctx.fillStyle='#000';
          ctx.font='6px monospace';
          ctx.fillText('!',px+TILE/2-2,py+11);
        }
      }
    }
  }

  // === DECORATIONS (street signs, billboards) ===
  for(let y=startTY;y<endTY;y++) {
    for(let x=startTX;x<endTX;x++) {
      if(map[y][x]!==2) continue;
      const h=((x+1)*73873+(y+1)*19349)%1000/1000;
      const px=x*TILE, py=y*TILE;

      // Street lamp
      if(h<0.07) {
        ctx.fillStyle='#5a5a5a';
        ctx.fillRect(px+TILE/2-1,py+4,2,12);
        ctx.fillStyle='#888';
        ctx.fillRect(px+TILE/2-4,py+2,8,4);
        ctx.fillStyle='#aaa';
        ctx.fillRect(px+TILE/2-1,py+14,2,2);
      }

      // Street sign
      if(h>=0.07&&h<0.10) {
        ctx.fillStyle='#5a5a5a';
        ctx.fillRect(px+TILE/2-1,py+2,2,12);
        ctx.fillStyle='#226633';
        ctx.fillRect(px+TILE/2-5,py+2,10,4);
        ctx.fillStyle='rgba(255,255,255,0.3)';
        ctx.font='3px monospace';
        ctx.fillText('ST',px+TILE/2-3,py+5);
      }

      // Billboard
      if(h>=0.12&&h<0.14) {
        ctx.fillStyle='#5a5a5a';
        ctx.fillRect(px+TILE/2-1,py,2,15);
        ctx.fillStyle=['#aa4444','#4444aa','#44aa44','#aaaa44'][Math.floor(h*10)%4];
        ctx.fillRect(px+6,py-4,TILE-12,6);
        ctx.fillStyle='rgba(255,255,255,0.15)';
        ctx.font='4px monospace';
        ctx.fillText('SALE',px+12,py-1);
      }

      // Trash can
      if(h>=0.15&&h<0.17) {
        ctx.fillStyle='#556';
        ctx.fillRect(px+TILE/2-3,py+4,6,8);
        ctx.fillStyle='#667';
        ctx.fillRect(px+TILE/2-3,py+4,6,2);
      }
    }
  }

  // === ENTITY SHADOWS (simple) ===
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(const car of cars) {
    ctx.beginPath();
    ctx.ellipse(car.x+2,car.y+4,car.height/2,car.width/2,car.angle,0,Math.PI*2);
    ctx.fill();
  }
  for(const npc of npcs) {
    if(!npc.alive) continue;
    ctx.beginPath();
    ctx.ellipse(npc.x+1,npc.y+3,6,4,0,0,Math.PI*2);
    ctx.fill();
  }
  for(const cop of police) {
    if(!cop.alive) continue;
    ctx.beginPath();
    ctx.ellipse(cop.x+1,cop.y+3,6,4,0,0,Math.PI*2);
    ctx.fill();
  }

  // === CARS ===
  for(const car of cars) {
    ctx.save();
    ctx.translate(car.x,car.y);
    ctx.rotate(car.angle);
    const w2=car.width/2, h2=car.height/2;
    const bodyCol=car.color;
    const darkCol=darken(bodyCol,40);
    const lightCol=lighten(bodyCol,30);

    // Body
    ctx.fillStyle=bodyCol;
    ctx.beginPath();
    ctx.roundRect(-h2+3,-w2+2,car.height-6,car.width-4,3);
    ctx.fill();
    // Body highlight
    ctx.fillStyle=lightCol;
    ctx.fillRect(-h2+6,-w2+3,car.height-14,3);
    // Lower trim
    ctx.fillStyle=darken(bodyCol,20);
    ctx.fillRect(-h2+4,w2-4,car.height-8,3);
    // Roof/cabin
    ctx.fillStyle=darkCol;
    ctx.beginPath();
    ctx.roundRect(-4,-w2+4,20,car.width-8,3);
    ctx.fill();
    // Windshield
    ctx.fillStyle='rgba(60,160,255,0.2)';
    ctx.fillRect(-h2+5,-w2+5,8,car.width-10);
    ctx.fillRect(h2-13,-w2+5,8,car.width-10);
    // Hood detail
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.fillRect(-h2+13,-w2+4,8,car.width-8);
    // Bumpers
    ctx.fillStyle='#444';
    ctx.fillRect(-h2-1,-w2+2,3,car.width-4);
    ctx.fillRect(h2-2,-w2+2,3,car.width-4);
    // Headlights
    ctx.fillStyle='rgba(255,255,240,0.5)';
    ctx.fillRect(-h2-2,-w2+4,4,5);
    ctx.fillRect(-h2-2,w2-9,4,5);
    // Tail lights
    ctx.fillStyle='rgba(255,30,30,0.4)';
    ctx.fillRect(h2-2,-w2+4,3,5);
    ctx.fillRect(h2-2,w2-9,3,5);
    // Wheels
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(-h2-3,-w2-4,5,8);
    ctx.fillRect(-h2-3,w2-4,5,8);
    ctx.fillRect(h2-2,-w2-4,5,8);
    ctx.fillRect(h2-2,w2-4,5,8);
    // Rims
    ctx.fillStyle='#666';
    ctx.fillRect(-h2-2,-w2-2,3,4);
    ctx.fillRect(-h2-2,w2-2,3,4);
    ctx.fillRect(h2-1,-w2-2,3,4);
    ctx.fillRect(h2-1,w2-2,3,4);
    // Honk ring
    if(car.honkTimer>0) {
      ctx.strokeStyle=`rgba(255,255,0,${car.honkTimer*0.3})`;
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(0,0,20+car.honkTimer*60,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // === NPCS ===
  for(const npc of npcs) {
    if(!npc.alive) continue;
    ctx.save();
    ctx.translate(npc.x,npc.y);
    const bob=Math.sin(npc.bobPhase)*2;
    // Body
    ctx.fillStyle=npc.color;
    ctx.beginPath();
    ctx.roundRect(-5,-10+bob,10,14,2);
    ctx.fill();
    // Arms
    ctx.strokeStyle='#e0c0a0';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-6,-6+bob); ctx.lineTo(-9,-2+bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6,-6+bob); ctx.lineTo(9,-2+bob); ctx.stroke();
    // Head
    ctx.fillStyle='#e0c0a0';
    ctx.beginPath();
    ctx.arc(0,-14+bob,4.5,0,Math.PI*2);
    ctx.fill();
    // Hair/hat
    if(npc.gender==='male') {
      ctx.fillStyle='#443';
      ctx.beginPath();
      ctx.arc(0,-16+bob,4.5,Math.PI,0);
      ctx.fill();
    } else {
      ctx.fillStyle=npc.color;
      ctx.beginPath();
      ctx.arc(0,-17+bob,5,Math.PI,0);
      ctx.fill();
    }
    // Legs
    const legOff=Math.sin(npc.bobPhase)*2.5;
    ctx.fillStyle=darken(npc.color,40);
    ctx.fillRect(-4,4+bob,3.5,7);
    ctx.fillRect(0.5,4+bob,3.5,7);
    ctx.restore();
  }

  // === POLICE ===
  for(const cop of police) {
    if(!cop.alive) continue;
    ctx.save();
    ctx.translate(cop.x,cop.y);
    const bob=Math.sin(cop.sirenPhase)*2;
    // Body
    ctx.fillStyle='#1a1a3a';
    ctx.beginPath();
    ctx.roundRect(-6,-11+bob,12,16,2);
    ctx.fill();
    // Badge
    ctx.fillStyle='#ff6';
    ctx.font='6px monospace';
    ctx.fillText('★',-3,-6+bob);
    // Utility belt
    ctx.fillStyle='#2a2a3a';
    ctx.fillRect(-6,0+bob,12,3);
    // Arms
    ctx.strokeStyle='#1a1a3a';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-7,-5+bob); ctx.lineTo(-11,0+bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7,-5+bob); ctx.lineTo(11,0+bob); ctx.stroke();
    // Head
    ctx.fillStyle='#e0c0a0';
    ctx.beginPath();
    ctx.arc(0,-16+bob,5,0,Math.PI*2);
    ctx.fill();
    // Hat
    ctx.fillStyle='#1a1a3a';
    ctx.fillRect(-7,-21+bob,14,5);
    ctx.fillRect(-5,-23+bob,10,4);
    ctx.fillStyle='#ff6';
    ctx.font='5px monospace';
    ctx.fillText('♦',-2,-20+bob);
    // Siren lights
    const flash=Math.sin(time*12)>0.5;
    ctx.fillStyle=flash?'#f44':'#48f';
    ctx.beginPath();
    ctx.arc(-4,-26+bob,3,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=flash?'#48f':'#f44';
    ctx.beginPath();
    ctx.arc(4,-26+bob,3,0,Math.PI*2);
    ctx.fill();
    // Legs
    ctx.fillStyle='#22224a';
    ctx.fillRect(-5,5+bob,4,8);
    ctx.fillRect(1,5+bob,4,8);
    ctx.restore();
  }

  // === BULLETS ===
  for(const b of bullets) {
    for(let t=1;t<b.trail.length;t++) {
      const alpha=t/b.trail.length*0.35;
      ctx.fillStyle=b.owner===player?`rgba(255,255,150,${alpha})`:`rgba(255,80,80,${alpha})`;
      const s=1.5+t/b.trail.length*0.5;
      ctx.beginPath();
      ctx.arc(b.trail[t].x,b.trail[t].y,s,0,Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle=b.owner===player?'#ff8':'#f66';
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fill();
  }

  // === PARTICLES ===
  for(const p of particles) {
    const alpha=p.life/p.maxLife;
    ctx.globalAlpha=alpha;
    if(p.type==='smoke') {
      ctx.fillStyle=p.color;
      const s=p.size*(1+(1-alpha)*0.3);
      ctx.beginPath();
      ctx.arc(p.x,p.y,s,0,Math.PI*2);
      ctx.fill();
    } else if(p.type==='blood') {
      ctx.fillStyle=alpha>0.5?'#f44':'rgba(140,20,20,'+alpha+')';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*(0.5+alpha*0.5),0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle=p.color;
      const s=p.size*(0.3+alpha*0.7);
      ctx.fillRect(p.x-s/2,p.y-s/2,s,s*0.6);
    }
  }
  ctx.globalAlpha=1;

  // === PLAYER (on foot) ===
  if(!player.inCar && player.alive) {
    ctx.save();
    ctx.translate(player.x,player.y);
    const bob=Math.sin(player.bobPhase)*2;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(2,5,8,4,0,0,Math.PI*2);
    ctx.fill();
    // Legs
    ctx.fillStyle='#334';
    ctx.fillRect(-5+bob*0.3,5,4.5,8);
    ctx.fillRect(0.5-bob*0.3,5,4.5,8);
    // Body
    ctx.fillStyle='#2a7a4a';
    ctx.beginPath();
    ctx.roundRect(-6,-12+bob,12,16,2);
    ctx.fill();
    // Body detail - zipper
    ctx.fillStyle='rgba(0,0,0,0.1)';
    ctx.fillRect(-1,-8+bob,2,8);
    // Arms
    const armA=player.angle;
    ctx.strokeStyle='#e0c0a0';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-5,-6+bob);
    ctx.lineTo(-5+Math.cos(armA-1)*8,-6+Math.sin(armA-1)*8+bob);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(5,-6+bob);
    ctx.lineTo(5+Math.cos(armA+1)*8,-6+Math.sin(armA+1)*8+bob);
    ctx.stroke();
    // Gun
    const gx=5+Math.cos(armA-0.3)*14;
    const gy=-5+Math.sin(armA-0.3)*14+bob;
    ctx.save();
    ctx.translate(gx,gy);
    ctx.rotate(armA);
    ctx.fillStyle='#444';
    ctx.fillRect(-1,-1.5,10,3);
    ctx.fillStyle='#666';
    ctx.fillRect(6,-1,3,2);
    ctx.restore();
    // Head
    ctx.fillStyle='#e0c0a0';
    ctx.beginPath();
    ctx.arc(0,-16+bob,5.5,0,Math.PI*2);
    ctx.fill();
    // Hair
    ctx.fillStyle='#332';
    ctx.beginPath();
    ctx.arc(0,-18+bob,5.5,Math.PI,0);
    ctx.fill();
    // Eyes (looking toward aim)
    const eA=player.angle;
    ctx.fillStyle='#222';
    ctx.beginPath();
    ctx.arc(Math.cos(eA-0.5)*2.5-0.5,-17+bob+Math.sin(eA-0.5)*1.5,1,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(Math.cos(eA+0.5)*2.5+0.5,-17+bob+Math.sin(eA+0.5)*1.5,1,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // end camera transform

  // === RAIN ===
  ctx.save();
  ctx.strokeStyle='rgba(140,160,200,0.1)';
  ctx.lineWidth=0.5;
  for(const r of rain) {
    ctx.globalAlpha=r.opacity;
    ctx.beginPath();
    ctx.moveTo(r.x,r.y);
    ctx.lineTo(r.x-20*dt,r.y+r.length);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // === CROSSHAIR ===
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(mouseX,mouseY,10,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouseX-14,mouseY); ctx.lineTo(mouseX-5,mouseY);
  ctx.moveTo(mouseX+5,mouseY); ctx.lineTo(mouseX+14,mouseY);
  ctx.moveTo(mouseX,mouseY-14); ctx.lineTo(mouseX,mouseY-5);
  ctx.moveTo(mouseX,mouseY+5); ctx.lineTo(mouseX,mouseY+14);
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.arc(mouseX,mouseY,1.5,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // === HUD ===
  updateHUD();
  renderMinimap();
}

function lighten(hex,amt) {
  const r=parseInt(hex.slice(1,3),16)+amt;
  const g=parseInt(hex.slice(3,5),16)+amt;
  const b=parseInt(hex.slice(5,7),16)+amt;
  return `rgb(${clamp(r,0,255)},${clamp(g,0,255)},${clamp(b,0,255)})`;
}
function darken(hex,amt){return lighten(hex,-amt)}

if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
  };
}

function updateHUD() {
  document.getElementById('hp-text').textContent=Math.floor(player.health);
  document.getElementById('hp-fill').style.width=`${(player.health/player.maxHealth)*100}%`;
  document.getElementById('ar-text').textContent=Math.floor(player.armor);
  document.getElementById('ar-fill').style.width=`${player.armor}%`;

  const aliveNPCs=npcs.filter(n=>n.alive).length;
  const alivePolice=police.filter(p=>p.alive).length;
  document.getElementById('pop-count').textContent=aliveNPCs;
  document.getElementById('cop-count').textContent=alivePolice;

  const wEl=document.getElementById('wanted-stars');
  const w=Math.floor(player.wanted);
  let stars='';
  for(let i=0;i<5;i++) stars+=`<span class="${i<w?'on':'off'}">${i<w?'★':'☆'}</span>`;
  wEl.innerHTML=stars;

  const spdEl=document.getElementById('speed-display');
  if(player.inCar) {
    const s=Math.floor(Math.abs(player.inCar.speed)*0.6);
    spdEl.innerHTML=`<div class="val">${s}</div><div class="unit">KM/H</div>`;
  } else spdEl.innerHTML='';
}

function renderMinimap() {
  const sz=180;
  const scale=sz/(MAP_W*TILE);
  minimapCtx.fillStyle='rgba(10,10,15,0.92)';
  minimapCtx.fillRect(0,0,sz,sz);

  for(let y=0;y<MAP_H;y+=2) {
    for(let x=0;x<MAP_W;x+=2) {
      const tile=map[y][x];
      const px=x*TILE*scale, py=y*TILE*scale;
      const s=TILE*scale*2;
      if(tile===0) minimapCtx.fillStyle='#3a3545';
      else if(tile===1) minimapCtx.fillStyle='#484';
      else if(tile===2) minimapCtx.fillStyle='#666';
      else if(tile===3) minimapCtx.fillStyle='#2a4a2a';
      else if(tile===4) minimapCtx.fillStyle='#555';
      else minimapCtx.fillStyle='#6a5a4a';
      minimapCtx.fillRect(px,py,s,s);
    }
  }

  minimapCtx.fillStyle='rgba(80,130,255,0.5)';
  for(const cop of police) {if(cop.alive) minimapCtx.fillRect(cop.x*scale-1.5,cop.y*scale-1.5,3,3);}
  minimapCtx.fillStyle='rgba(200,200,80,0.25)';
  for(const npc of npcs) {if(npc.alive) minimapCtx.fillRect(npc.x*scale-1,npc.y*scale-1,2,2);}
  minimapCtx.fillStyle='#4f4';
  minimapCtx.beginPath();
  minimapCtx.arc(player.x*scale,player.y*scale,3,0,Math.PI*2);
  minimapCtx.fill();
  minimapCtx.strokeStyle='rgba(255,255,255,0.15)';
  minimapCtx.lineWidth=1;
  minimapCtx.strokeRect(camera.x*scale,camera.y*scale,canvas.width*scale,canvas.height*scale);
}

// ==================== GAME LOOP ====================
let lastTime=0;
let accumulator=0;

function gameLoop(time) {
  if(!lastTime) lastTime=time;
  const delta=Math.min((time-lastTime)/1000,0.1);
  lastTime=time;
  if(gameRunning) {
    accumulator+=delta;
    while(accumulator>=dt) {
      updatePlayer();
      updateNPCs();
      updatePolice();
      updateBullets();
      updateParticles();
      frame++;
      accumulator-=dt;
    }
    render();
    updateRain();
  }
  requestAnimationFrame(gameLoop);
}

function init() {
  gameRunning=true;
  generateMap();
  player=new Player();
  cars=[]; npcs=[]; police=[]; bullets=[]; particles=[];
  spawnCars(); spawnNPCs(); initRain();
  money=0; totalEarned=0;
  player.armor=25;
  smoothCam={x:player.x-canvas.width/2,y:player.y-canvas.height/2};
}

init();
requestAnimationFrame(gameLoop);
